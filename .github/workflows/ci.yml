name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout ModernTubeDownloader
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read central framework pin
        id: pins
        shell: pwsh
        run: |
          [xml] $props = Get-Content .\Directory.Build.props -Raw
          $sha = $props.SelectSingleNode('/Project/PropertyGroup/ModernFormsNextCommit').InnerText.Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid MFN pin.' }
          "mfn=$sha" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned ModernFormsNext
        uses: actions/checkout@v5
        with:
          repository: ProGraMajster/ModernFormsNext
          ref: ${{ steps.pins.outputs.mfn }}
          path: .mfn-master-worktree

      - name: Verify exact clean framework checkout
        shell: pwsh
        run: |
          if ((git -C .mfn-master-worktree rev-parse HEAD) -ne '${{ steps.pins.outputs.mfn }}') { throw 'MFN pin mismatch.' }
          if (git -C .mfn-master-worktree status --porcelain) { throw 'MFN checkout is dirty.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js for Web Remote tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test extension and Web Remote time editor
        run: node --test browser-extension/tests/*.test.cjs ModernTubeDownloader.Tests/WebRemote*.test.cjs

      - name: Check public repository hygiene
        run: node scripts/Test-PublicRepository.cjs

      - name: Restore, Debug and Release tests, NativeHost, publish and package gates
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -ModernFormsNextRoot "$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Preserve test results and hang sequence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-results
          path: |
            artifacts/validation/**/*.trx
            artifacts/validation/**/Sequence_*.xml
          if-no-files-found: error
