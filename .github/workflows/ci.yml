name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout ModernTubeDownloader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned ModernFormsNext
        uses: actions/checkout@v4
        with:
          repository: ProGraMajster/ModernFormsNext
          ref: f521f9dfcfe601bf9b6199b88132cccb2380d1bf
          path: .mfn-master-worktree

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js for Web Remote tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test extension and Web Remote time editor
        run: node --test browser-extension/tests/*.test.cjs ModernTubeDownloader.Tests/WebRemoteTimeInput.test.cjs

      - name: Check public repository hygiene
        run: node scripts/Test-PublicRepository.cjs

      - name: Restore
        shell: pwsh
        run: dotnet restore .\ModernTubeDownloader.slnx -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Build Release
        shell: pwsh
        run: dotnet build .\ModernTubeDownloader.slnx -c Release --no-restore -warnaserror -m:1 /p:UseSharedCompilation=false -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Test Release
        shell: pwsh
        run: dotnet test .\ModernTubeDownloader.slnx -c Release --no-build -m:1 /p:UseSharedCompilation=false -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"
