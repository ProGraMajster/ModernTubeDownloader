name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout ModernTubeDownloader
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout pinned ModernFormsNext
        uses: actions/checkout@v5
        with:
          repository: ProGraMajster/ModernFormsNext
          ref: f521f9dfcfe601bf9b6199b88132cccb2380d1bf
          path: .mfn-master-worktree

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js for Web Remote tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test extension and Web Remote time editor
        run: node --test browser-extension/tests/*.test.cjs ModernTubeDownloader.Tests/WebRemoteTimeInput.test.cjs

      - name: Check public repository hygiene
        run: node scripts/Test-PublicRepository.cjs

      - name: Restore
        shell: pwsh
        run: dotnet restore .\ModernTubeDownloader.slnx -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Build Release
        shell: pwsh
        run: dotnet build .\ModernTubeDownloader.slnx -c Release --no-restore -warnaserror -m:1 /p:UseSharedCompilation=false -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Test Release
        shell: pwsh
        run: dotnet test .\ModernTubeDownloader.slnx -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=ci-validation.trx" --results-directory artifacts/ci-validation --blame-hang-timeout 3m --blame-hang-dump-type none -m:1 /p:UseSharedCompilation=false -p:ModernFormsNextRoot="$env:GITHUB_WORKSPACE\.mfn-master-worktree"

      - name: Preserve test results and hang sequence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-test-results
          path: |
            artifacts/ci-validation/**/*.trx
            artifacts/ci-validation/**/Sequence_*.xml
          if-no-files-found: error
